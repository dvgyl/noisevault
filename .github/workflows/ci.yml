name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The jobs install the newest framework releases. A weekly run finds a release that breaks an
  # export between pushes. GitHub turns the schedule off after 60 days with no repository activity.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is in the group, so a push to main does not cancel the scheduled run on main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  core:
    name: core install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install -e . pytest
      # Framework tests skip here; this job proves the core works without any framework.
      - run: pytest -q

  full:
    name: full install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install -e '.[all,dev]'
      - run: pytest -q --ignore=tests/test_examples.py
        env:
          NOISEVAULT_REQUIRE_ALL: "1"

  coverage:
    name: nv compare interval coverage over 100 simulated runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install -e . pytest
      - run: pytest -q tests/test_compare.py -k each_interval_covers
        env:
          NOISEVAULT_SLOW: "1"

  lowest:
    name: lowest declared versions (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      # Every direct dependency at its declared floor, so a floor that stops working fails here.
      # Python 3.11 because the numpy floor has no wheels for 3.13 or later.
      - run: uv pip install --resolution lowest-direct -e '.[all,dev]'
      # Speed budgets are set on current releases; the full jobs hold them.
      - run: pytest -q --ignore=tests/test_examples.py -m "not timing"
        env:
          NOISEVAULT_REQUIRE_ALL: "1"

  bundle:
    name: tests pinned to the bundle's qiskit-ibm-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      # The full job installs the newest qiskit-ibm-runtime, which may ship other snapshots than
      # the release the bundled files name; tests that compare against those snapshots skip there
      # and run here, under that release.
      - run: |
          release=$(python -c 'import gzip, json, pathlib; f = next(pathlib.Path("src/noisevault/data/profiles").glob("ibm_fez@*.json.gz")); print(json.loads(gzip.decompress(f.read_bytes()))["provenance"]["source"].split()[1])')
          uv pip install -e '.[ibm]' pytest "qiskit-ibm-runtime==${release}"
      - run: pytest -q tests/test_catalog_bundle.py tests/test_compat.py
        env:
          NOISEVAULT_REQUIRE_ALL: "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - name: Wheel is smaller than 3 MB
        run: |
          size=$(stat -c %s dist/*.whl)
          echo "wheel: ${size} bytes"
          test "$size" -lt 3000000
      - name: Wheel has the py.typed marker
        run: unzip -l dist/*.whl | grep -q ' noisevault/py.typed$'
      - name: Install the wheel in a fresh venv outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/nv list
          wheel-env/bin/nv show ibm_fez
          wheel-env/bin/python - <<'EOF'
          import sys

          import noisevault as nv

          frameworks = {"qiskit", "qiskit_aer", "cirq", "pennylane", "stim"}
          loaded = sorted(frameworks & set(sys.modules))
          assert not loaded, f"import noisevault imported {loaded}"
          assert len(nv.profiles()) == 25, len(nv.profiles())
          print(nv.load("ibm_fez").summary())
          EOF

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # Python 3.12 so the Mitiq example runs too: Mitiq supports Python up to 3.12.
      - run: uv pip install -e '.[all,dev]' matplotlib mitiq ply
      - run: pytest -q tests/test_examples.py
        env:
          NOISEVAULT_REQUIRE_ALL: "1"
