name: Job check

# A manual check of the functions that read an IBM Quantum job, with a real job of the account
# of the secret IBM_QUANTUM_TOKEN. The check reads the newest finished sampler job. It uses no
# device time.
#
# The log of a public repository is public. The program with the account therefore writes
# nothing to the log: its output and each error text go to a file that the job does not keep.
# The log gets one fixed line for each check, and the type of an error.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install -e '.[ibm]'
      - name: Read the newest finished sampler job
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          NOISEVAULT_HOME: ${{ runner.temp }}/noisevault
          RESULT: ${{ runner.temp }}/job-check-result.txt
        run: |
          if [ -z "$IBM_QUANTUM_TOKEN" ]; then
            echo "::error::The repository has no secret IBM_QUANTUM_TOKEN."
            exit 1
          fi
          status=0
          python - > "$RUNNER_TEMP/job-check-output.txt" 2>&1 <<'EOF' || status=$?
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import noisevault as nv
          from noisevault.sources.ibm_account import _service

          result = Path(os.environ["RESULT"])
          lines = []


          def step(name, action):
              try:
                  action()
              except Exception as exc:
                  lines.append(f"FAILED {name}: {type(exc).__name__}")
                  return False
              lines.append(f"ok {name}")
              return True


          def newest_job():
              service = _service()
              for job in service.jobs(limit=None, program_id="sampler", pending=False):
                  if str(getattr(job.status(), "name", job.status())) == "DONE":
                      return job
              raise LookupError("no finished sampler job")


          chosen = []
          if step("find the newest finished sampler job", lambda: chosen.append(newest_job())):
              job = chosen[0]
              job_id, device = job.job_id(), job.backend().name


              def pull_in_python():
                  nv.pull(device, job=job_id)


              def pull_on_the_command_line():
                  with tempfile.TemporaryDirectory() as folder:
                      target = Path(folder) / "job.json.gz"
                      run = subprocess.run(
                          ["nv", "pull", device, "--job", job_id, "--output", str(target)],
                          capture_output=True,
                          text=True,
                          check=True,
                      )
                      if "started at" not in run.stdout:
                          raise ValueError("no start time in the output")
                      nv.load(target)


              def read_the_job():
                  profile, counts = nv.from_ibm_job(job)
                  profile.score(counts)


              step("nv.pull with job=", pull_in_python)
              step("nv pull --job", pull_on_the_command_line)
              step("nv.from_ibm_job and Profile.score", read_the_job)
          result.write_text("\n".join(lines) + "\n", encoding="utf-8")
          sys.exit(0 if all(line.startswith("ok ") for line in lines) else 1)
          EOF
          if [ -f "$RESULT" ]; then
            cat "$RESULT"
          else
            echo "The check stopped before it wrote a result."
          fi
          rm -f "$RUNNER_TEMP/job-check-output.txt"
          exit "$status"
