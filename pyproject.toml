[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "noisevault"
version = "0.2.0"
description = "Pins the calibrated noise of a real quantum device, on a date, as one small file, and turns it into a noise model for Qiskit, Cirq, PennyLane or Stim, with a report of what each simulator reproduced or approximated."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dev D. Goyal" }]
keywords = [
  "quantum computing",
  "quantum noise",
  "noise model",
  "device calibration",
  "reproducibility",
  "qiskit",
  "cirq",
  "pennylane",
  "stim",
  "quantum error correction",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8,<3",
  "typer>=0.27",
  "rich>=13.8",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.1", "qiskit-aer>=0.17"]
ibm = ["noisevault[qiskit]", "qiskit-ibm-runtime>=0.40"]
cirq = ["cirq-core>=1.5"]
pennylane = ["pennylane>=0.43.3"]
stim = ["stim>=1.15"]
google = ["noisevault[cirq]", "cirq-google>=1.6"]
hf = ["pyarrow>=14.0.1"]
all = ["noisevault[qiskit,ibm,cirq,pennylane,stim,google,hf]"]
dev = [
  "noisevault[all]",
  "amazon-braket-schemas>=1.22",
  "pymatching>=2.2",
  "pytest>=8",
  "ruff>=0.9",
  "build>=1.2",
]

[project.scripts]
noisevault = "noisevault.cli:app"
nv = "noisevault.cli:app"

[project.urls]
Homepage = "https://github.com/dvgyl/noisevault"
Documentation = "https://github.com/dvgyl/noisevault/tree/main/docs"
Issues = "https://github.com/dvgyl/noisevault/issues"
Changelog = "https://github.com/dvgyl/noisevault/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI cannot resolve relative paths. Images go to raw.githubusercontent.com, links to the
# GitHub file view. Absolute URLs, anchors and root paths are left alone. Images run first.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|[#/])'
replacement = '\g<1>https://raw.githubusercontent.com/dvgyl/noisevault/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(\s(?:src|srcset)=["'])(?![a-zA-Z][a-zA-Z0-9+.-]*:|[#/])'''
replacement = '\g<1>https://raw.githubusercontent.com/dvgyl/noisevault/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(\shref=["'])(?![a-zA-Z][a-zA-Z0-9+.-]*:|[#/])'''
replacement = '\g<1>https://github.com/dvgyl/noisevault/blob/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|[#/])'
replacement = '\g<1>https://github.com/dvgyl/noisevault/blob/main/'

[tool.hatch.build.targets.wheel]
packages = ["src/noisevault"]

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "docs", "examples", "scripts",
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "NOTICE", "CITATION.cff", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: needs internet access to a live calibration source; runs with NOISEVAULT_NETWORK=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
